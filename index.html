<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>FinTrack</h1>
        
        <div class="balance-container">
            <div class="balance-item">
                <div class="balance-title">INCOME</div>
                <div class="balance-amount income" id="total-income">$0.00</div>
            </div>
            <div class="balance-item">
                <div class="balance-title">EXPENSES</div>
                <div class="balance-amount expense" id="total-expense">$0.00</div>
            </div>
            <div class="balance-item">
                <div class="balance-title">BALANCE</div>
                <div class="balance-amount balance" id="total-balance">$0.00</div>
            </div>
        </div>
        
        <div class="form-container">
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" placeholder="Enter description...">
            </div>
            <div class="form-group">
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="Enter amount...">
            </div>
            <div class="form-group">
                <label for="type">Type</label>
                <select id="type">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>
            </div>
            <div class="form-group">
                <label for="category">Category</label>
                <select id="category">
                    <option value="food">Food</option>
                    <option value="transportation">Transportation</option>
                    <option value="housing">Housing</option>
                    <option value="utilities">Utilities</option>
                    <option value="entertainment">Entertainment</option>
                    <option value="healthcare">Healthcare</option>
                    <option value="education">Education</option>
                    <option value="personal">Personal</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date">
            </div>
            <button class="btn btn-full" id="add-transaction">Add Transaction</button>
        </div>
        
        <div class="month-selector">
            <div class="month-nav">
                <button id="prev-month">&lt;</button>
                <div class="current-month" id="current-month-display">April 2025</div>
                <button id="next-month">&gt;</button>
            </div>
        </div>
        
        <div id="transactions-container">
            <table id="transactions-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="transactions-list">
                    <!-- Transactions will be added here -->
                </tbody>
            </table>
            <div id="no-transactions" class="no-transactions">No transactions for this month</div>
        </div>
        
        <div class="summary-container">
            <div class="summary-title">Monthly Summary</div>
            <div id="category-summary">
                <!-- Category summary will be added here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
